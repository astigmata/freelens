[project]
name = "freelens"
version = "0.1.0"
description = "A lightweight, web-based Kubernetes cluster explorer built with Dash."
requires-python = ">=3.10"
dependencies = [
    "dash>=3.0.0",
    "kubernetes>=32.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.16",
]

[tool.setuptools.packages.find]
include = ["freelens*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "BLE", "RET", "RUF"]
ignore = ["E501", "RUF005"]
